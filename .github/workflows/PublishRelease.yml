name: Publish release

# The tag is the version, without a prefix: 1.0.0, 1.1.0-preview.1, ...
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  windows:
    name: windows-2025
    runs-on: windows-2025
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build
        run: dotnet build MultiSound.slnx -c Release

      - name: Test
        run: dotnet run --project tests/MultiSound.Tests -c Release --no-build

      - name: Publish
        run: dotnet publish src/MultiSound.App -c Release -o output -p:Version=${{ github.ref_name }}

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="output/MultiSound-${{ github.ref_name }}-win-x64.exe"
          mv output/MultiSound.exe "$asset"
          prerelease=""
          case "${{ github.ref_name }}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${{ github.ref_name }}" "$asset" --title "MultiSound ${{ github.ref_name }}" --target "${{ github.sha }}" $prerelease \
            --notes "Звук Windows сразу на несколько наушников: проводные и Bluetooth, синхронно, с подстройкой сдвига на слух. Один exe для Windows 10/11 x64, без установки и драйверов."

      - name: Delete the tag on failure
        if: failure()
        shell: bash
        run: git push origin --delete "${{ github.ref_name }}"
